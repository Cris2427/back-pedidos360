openapi: 3.0.1

info:
  title: pedidos360-api
  description: >-
    API de Pedidos y Catálogo del sistema Pedidos360. Protegida con Microsoft
    Entra ID en dos capas: el JWT authorizer del API Gateway valida firma,
    issuer, audience y expiración; cada Lambda revalida los claims `scp`
    (scopes delegados) y `roles` (App Roles) antes de tocar los datos.


    Reparto por rol: el **Admin** administra el catálogo y el stock; el
    **Cliente** y el **Operador** tienen el CRUD de pedidos; solo el
    **Operador** avanza el ciclo de estados.
  version: '2.0.0'

servers:
  - url: https://5hnna48kv8.execute-api.us-east-1.amazonaws.com
    description: Etapa $default

tags:
  - name: catalog
    description: Productos y stock (dominio Catálogo, del Admin)
  - name: orders
    description: Pedidos y su ciclo de estados (dominio Pedidos, del Cliente y el Operador)
  - name: admin
    description: >-
      Microservicio administrador de la mensajería: colas SQS (con su DLQ),
      topics SNS (exchanges) y suscripciones (bindings). Solo App Role Admin.

# el cors va en el api porque el preflight OPTIONS viaja sin token, asi lo
# responde el api gateway antes de llegar al authorizer
x-amazon-apigateway-cors:
  allowOrigins:
    - http://localhost:5173
  allowMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
  allowHeaders: [authorization, content-type]
  maxAge: 3600

components:
  securitySchemes:
    entraJwt:
      type: oauth2
      flows: {}
      x-amazon-apigateway-authorizer:
        type: jwt
        identitySource: $request.header.Authorization
        jwtConfiguration:
          issuer: https://login.microsoftonline.com/20d60927-bff9-498f-8c5b-94db0ccba634/v2.0
          # las dos formas del claim aud, porque el authorizer compara literal
          audience:
            - 4af5ea55-a655-4bcb-b24c-9e315b1ee75c
            - api://4af5ea55-a655-4bcb-b24c-9e315b1ee75c

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
    Name:
      name: name
      in: path
      required: true
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]+$'

  schemas:
    Product:
      type: object
      required: [nombre, precio, stock]
      properties:
        id: { type: string, example: p-001, readOnly: true }
        nombre: { type: string, example: Notebook 14" }
        precio: { type: number, minimum: 0, example: 499990 }
        stock: { type: integer, minimum: 0, example: 8 }

    OrderItem:
      type: object
      required: [productoId, cantidad]
      properties:
        productoId: { type: string, example: p-001 }
        cantidad: { type: integer, minimum: 1, example: 2 }
        precio:
          type: number
          readOnly: true
          description: Precio unitario congelado al crear el pedido (lo fija el servidor).

    OrderStatus:
      type: string
      enum: [CREADO, ACEPTADO, EN_PREPARACION, DESPACHADO, ENTREGADO, CANCELADO]

    Order:
      type: object
      required: [items]
      properties:
        id: { type: string, readOnly: true, example: o-mg4k2f1a }
        clienteId:
          type: string
          example: cliente@duocuc.cl
          description: >-
            Para un Cliente lo fija el servidor con la identidad del token y se
            ignora lo que venga en el cuerpo; un Operador sí puede registrar el
            pedido a nombre de un tercero.
        items:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/OrderItem' }
        total:
          type: number
          readOnly: true
          description: Lo recalcula el servidor; se ignora lo que mande el cliente.
        estado:
          allOf: [{ $ref: '#/components/schemas/OrderStatus' }]
          readOnly: true
        creadoEn: { type: string, format: date-time, readOnly: true }

    Error:
      type: object
      properties:
        error: { type: string }
        hint: { type: string }

    Eliminado:
      type: object
      properties:
        eliminado: { type: string }

    Mensajes:
      type: object
      properties:
        disponibles: { type: integer }
        enProceso: { type: integer, description: Recibidos por un consumidor y todavía invisibles. }

    NuevaCola:
      type: object
      required: [nombre]
      additionalProperties: false
      properties:
        nombre:
          type: string
          maxLength: 76
          pattern: '^[A-Za-z0-9_-]+$'
          description: >-
            Sin tildes ni espacios y sin terminar en "-dlq": la DLQ se crea sola
            con ese sufijo. Solo colas estándar, así que nada de ".fifo".
          example: q-sms
        maxReceiveCount:
          type: integer
          minimum: 1
          maximum: 1000
          default: 3
          description: Intentos antes de que SQS mueva un mensaje a la DLQ.
        visibilidadSegundos:
          type: integer
          minimum: 0
          maximum: 43200
          default: 30
          description: Debe ser mayor que el timeout de la Lambda que consuma la cola.

    Cola:
      type: object
      properties:
        nombre: { type: string, example: q-email }
        arn: { type: string }
        visibilidadSegundos: { type: integer, example: 30 }
        maxReceiveCount: { type: integer, nullable: true, example: 3 }
        mensajes: { $ref: '#/components/schemas/Mensajes' }
        dlq:
          type: object
          nullable: true
          properties:
            nombre: { type: string, example: q-email-dlq }
            mensajes: { $ref: '#/components/schemas/Mensajes' }
        consumidor:
          type: string
          nullable: true
          description: La Lambda conectada a la cola, si hay una.
          example: notificar-email

    ColaEliminada:
      type: object
      properties:
        eliminada: { type: string, example: q-sms }
        dlq: { type: string, nullable: true, example: q-sms-dlq }

    NuevoTopic:
      type: object
      required: [nombre]
      additionalProperties: false
      properties:
        nombre: { type: string, maxLength: 256, pattern: '^[A-Za-z0-9_-]+$', example: pedidos360-eventos }

    Topic:
      type: object
      properties:
        nombre: { type: string, example: pedidos360-eventos }
        arn: { type: string }
        suscripciones: { type: integer, example: 3 }

    FiltroSns:
      type: object
      maxProperties: 5
      minProperties: 1
      description: >-
        Filter policy sobre los atributos del mensaje. Cada atributo lleva una
        lista de valores exactos (exchange direct) u operadores como prefix
        (exchange topic).
      additionalProperties:
        type: array
        minItems: 1
        items: {}
      example: { tipo_evento: [{ prefix: Pedido }] }

    NuevoBinding:
      type: object
      required: [topic, cola]
      additionalProperties: false
      properties:
        topic: { type: string, example: pedidos360-eventos }
        cola: { type: string, example: q-sms }
        filtro: { $ref: '#/components/schemas/FiltroSns' }

    Binding:
      type: object
      properties:
        id: { type: string, description: Último tramo del ARN de la suscripción. }
        topic: { type: string, example: pedidos360-eventos }
        cola: { type: string, example: q-email }
        filtro: { $ref: '#/components/schemas/FiltroSns' }
        entregaSinProcesar: { type: boolean, example: true }

  responses:
    Unauthorized:
      description: Token ausente, mal firmado, vencido o con otro issuer/audience (lo rechaza el authorizer).
    Forbidden:
      description: Token válido pero sin el scope o el App Role que exige el endpoint.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    BadRequest:
      description: Datos inválidos en el cuerpo de la petición.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: >-
        El recurso no existe. Un Cliente recibe esto también cuando el pedido
        es de otra persona: no se revela su existencia.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Choca con una regla de negocio (transición inválida, stock o estado no permitido).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

# por defecto todo exige token; cada operacion agrega su scope y el
# gateway lo revisa antes de invocar la lambda (ambitos de autorizacion)
security:
  - entraJwt: []

paths:
  # ---- catalogo ----
  /api/catalog:
    get:
      tags: [catalog]
      summary: Lista los productos
      description: 'Scope `catalog.read`. Lo pueden leer los tres roles: el Cliente y el Operador necesitan el catálogo para armar un pedido.'
      security:
        - entraJwt: [catalog.read]
      responses:
        '200':
          description: Lista de productos
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Product' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        payloadFormatVersion: '2.0'
        uri: arn:aws:apigateway:us-east-1:lambda:path/2015-03-31/functions/arn:aws:lambda:us-east-1:<ACCOUNT_ID>:function:pedidos360-catalog-get/invocations

    post:
      tags: [catalog]
      summary: Crea un producto
      description: 'Scope `catalog.write` y App Role `Admin`.'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Product' }
      security:
        - entraJwt: [catalog.write]
      responses:
        '201':
          description: Producto creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        payloadFormatVersion: '2.0'
        uri: arn:aws:apigateway:us-east-1:lambda:path/2015-03-31/functions/arn:aws:lambda:us-east-1:<ACCOUNT_ID>:function:pedidos360-catalog-post/invocations

  /api/catalog/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      tags: [catalog]
      summary: Edita un producto completo
      description: 'Scope `catalog.write` y App Role `Admin`.'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Product' }
      security:
        - entraJwt: [catalog.write]
      responses:
        '200':
          description: Producto actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        payloadFormatVersion: '2.0'
        uri: arn:aws:apigateway:us-east-1:lambda:path/2015-03-31/functions/arn:aws:lambda:us-east-1:<ACCOUNT_ID>:function:pedidos360-catalog-put/invocations

    delete:
      tags: [catalog]
      summary: Elimina un producto
      description: >-
        Scope `catalog.write` y App Role `Admin`. Responde 409 si el producto
        está comprometido en un pedido en curso.
      security:
        - entraJwt: [catalog.write]
      responses:
        '200':
          description: Producto eliminado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Eliminado' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        payloadFormatVersion: '2.0'
        uri: arn:aws:apigateway:us-east-1:lambda:path/2015-03-31/functions/arn:aws:lambda:us-east-1:<ACCOUNT_ID>:function:pedidos360-catalog-delete/invocations

  /api/catalog/{id}/stock:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      tags: [catalog]
      summary: Ajusta el stock de un producto
      description: 'Scope `catalog.write` y App Role `Admin`.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stock]
              properties:
                stock: { type: integer, minimum: 0 }
      security:
        - entraJwt: [catalog.write]
      responses:
        '200':
          description: Stock actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        payloadFormatVersion: '2.0'
        uri: arn:aws:apigateway:us-east-1:lambda:path/2015-03-31/functions/arn:aws:lambda:us-east-1:<ACCOUNT_ID>:function:pedidos360-catalog-stock-put/invocations

  # ---- pedidos ----
  /api/orders:
    get:
      tags: [orders]
      summary: Lista los pedidos visibles para quien pregunta
      description: >-
        Scope `orders.read` y App Role `Cliente` u `Operador` (el Admin recibe
        403). El Operador ve todos los pedidos; el Cliente solo los suyos, y el
        filtro lo aplica la Lambda, no el navegador.
      security:
        - entraJwt: [orders.read]
      responses:
        '200':
          description: Lista de pedidos
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Order' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        payloadFormatVersion: '2.0'
        uri: arn:aws:apigateway:us-east-1:lambda:path/2015-03-31/functions/arn:aws:lambda:us-east-1:<ACCOUNT_ID>:function:pedidos360-orders-get/invocations

    post:
      tags: [orders]
      summary: Crea un pedido (queda en CREADO)
      description: >-
        Scope `orders.write` y App Role `Cliente` u `Operador`. Valida
        disponibilidad de stock pero NO lo descuenta: según la regla del caso,
        el stock decrece al ACEPTAR el pedido.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Order' }
      security:
        - entraJwt: [orders.write]
      responses:
        '201':
          description: Pedido creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        payloadFormatVersion: '2.0'
        uri: arn:aws:apigateway:us-east-1:lambda:path/2015-03-31/functions/arn:aws:lambda:us-east-1:<ACCOUNT_ID>:function:pedidos360-orders-post/invocations

  /api/orders/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      tags: [orders]
      summary: Edita un pedido
      description: >-
        Scope `orders.write` y App Role `Cliente` (solo los suyos) u
        `Operador`. Solo mientras el pedido está en CREADO: después ya
        comprometió stock.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Order' }
      security:
        - entraJwt: [orders.write]
      responses:
        '200':
          description: Pedido actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        payloadFormatVersion: '2.0'
        uri: arn:aws:apigateway:us-east-1:lambda:path/2015-03-31/functions/arn:aws:lambda:us-east-1:<ACCOUNT_ID>:function:pedidos360-orders-put/invocations

    delete:
      tags: [orders]
      summary: Elimina un pedido
      description: >-
        Scope `orders.write` y App Role `Cliente` (solo los suyos) u
        `Operador`. Solo en CREADO o CANCELADO: un pedido con stock
        comprometido hay que cancelarlo primero.
      security:
        - entraJwt: [orders.write]
      responses:
        '200':
          description: Pedido eliminado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Eliminado' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        payloadFormatVersion: '2.0'
        uri: arn:aws:apigateway:us-east-1:lambda:path/2015-03-31/functions/arn:aws:lambda:us-east-1:<ACCOUNT_ID>:function:pedidos360-orders-delete/invocations

  /api/orders/{id}/status:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [orders]
      summary: Avanza el pedido por su ciclo de estados
      description: >-
        Scope `orders.write` y App Role `Operador`. Transiciones permitidas:
        CREADO→ACEPTADO|CANCELADO, ACEPTADO→EN_PREPARACION|CANCELADO,
        EN_PREPARACION→DESPACHADO, DESPACHADO→ENTREGADO. No se puede despachar
        sin aceptar. Al pasar a ACEPTADO se descuenta el stock (de forma
        condicional y atómica); al CANCELAR se devuelve solo si alcanzó a
        descontarse.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [estado]
              properties:
                estado: { $ref: '#/components/schemas/OrderStatus' }
      security:
        - entraJwt: [orders.write]
      responses:
        '200':
          description: Pedido actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        payloadFormatVersion: '2.0'
        uri: arn:aws:apigateway:us-east-1:lambda:path/2015-03-31/functions/arn:aws:lambda:us-east-1:<ACCOUNT_ID>:function:pedidos360-orders-status/invocations

  # ---- microservicio administrador de la mensajeria ----
  /api/admin/queues:
    get:
      tags: [admin]
      summary: Lista las colas, cada una con su DLQ, sus mensajes y su consumidor
      description: Scope `messaging.manage` y App Role `Admin`. Las DLQ aparecen dentro de su cola.
      security:
        - entraJwt: [messaging.manage]
      responses:
        '200':
          description: Colas
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Cola' } }
        '403': { $ref: '#/components/responses/Forbidden' }
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        payloadFormatVersion: '2.0'
        uri: arn:aws:apigateway:us-east-1:lambda:path/2015-03-31/functions/arn:aws:lambda:us-east-1:<ACCOUNT_ID>:function:pedidos360-admin-queues-get/invocations

    post:
      tags: [admin]
      summary: Crea una cola estándar y su DLQ, con la redrive policy
      description: >-
        Scope `messaging.manage` y App Role `Admin`. Crea primero `<nombre>-dlq`
        y después la cola, apuntando a ella. Rechaza campos desconocidos.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NuevaCola' }
      security:
        - entraJwt: [messaging.manage]
      responses:
        '201':
          description: Cola creada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cola' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        payloadFormatVersion: '2.0'
        uri: arn:aws:apigateway:us-east-1:lambda:path/2015-03-31/functions/arn:aws:lambda:us-east-1:<ACCOUNT_ID>:function:pedidos360-admin-queues-post/invocations

  /api/admin/queues/{name}:
    parameters:
      - $ref: '#/components/parameters/Name'
    delete:
      tags: [admin]
      summary: Borra una cola y su DLQ
      description: >-
        Scope `messaging.manage` y App Role `Admin`. Responde 409, sin borrar
        nada, si la cola es la DLQ de otra, si una Lambda la consume, si está
        suscrita a un topic o si ella o su DLQ tienen mensajes.
      security:
        - entraJwt: [messaging.manage]
      responses:
        '200':
          description: Cola y DLQ eliminadas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ColaEliminada' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        payloadFormatVersion: '2.0'
        uri: arn:aws:apigateway:us-east-1:lambda:path/2015-03-31/functions/arn:aws:lambda:us-east-1:<ACCOUNT_ID>:function:pedidos360-admin-queues-delete/invocations

  /api/admin/topics:
    get:
      tags: [admin]
      summary: Lista los topics (exchanges) con su cantidad de suscripciones
      description: Scope `messaging.manage` y App Role `Admin`.
      security:
        - entraJwt: [messaging.manage]
      responses:
        '200':
          description: Topics
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Topic' } }
        '403': { $ref: '#/components/responses/Forbidden' }
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        payloadFormatVersion: '2.0'
        uri: arn:aws:apigateway:us-east-1:lambda:path/2015-03-31/functions/arn:aws:lambda:us-east-1:<ACCOUNT_ID>:function:pedidos360-admin-topics-get/invocations

    post:
      tags: [admin]
      summary: Crea un topic estándar
      description: Scope `messaging.manage` y App Role `Admin`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NuevoTopic' }
      security:
        - entraJwt: [messaging.manage]
      responses:
        '201':
          description: Topic creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Topic' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        payloadFormatVersion: '2.0'
